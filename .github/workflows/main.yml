name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    # Build on every change except the drawings, so [Draw] commits do not retrigger
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  build:
    # Pinned to the ZMK revision in config/west.yml. The @main workflow's board-compat
    # step needs Zephyr 4.1 and fails on v0.3.0 (KeyError: 'qualifiers').
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_version: "0.23.0"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml" # config file, ignored if not exists
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""   # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"
