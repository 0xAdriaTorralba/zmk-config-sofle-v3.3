draw_config:
  n_columns: 1
  draw_key_sides: true
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    /* For default sytles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }

    /* Color accent for held keys */
    rect.held, rect.combo.held {
        fill: #ffc;
    }

    /* Technique borrowed and extended from https://github.com/englmaxi/zmk-config/blob/master/keymap-drawer/config.yaml */
    .sym_sub_text.tap {
      translate: -5px 2px;
      font-size: 20px;
    }
    .sym_sub_text.shifted {
      translate: 10px 13px;
      font-size: 10px;
      opacity: 1.0;
    }
    .combo.sym_sub_text.tap {
      translate: -1px 1px;
    }
    .combo.sym_sub_text.shifted {
      translate: 7px 5px;
      font-size: 10px;
      opacity: 1.0;
    }

    /* Toggle */
    .toggle.shifted {
      translate: -10px 12px;
    }

    .toggle.hold {
      translate: 13px -23px;
    }

    /* Variant for tap-dances */
    .tap_dance.tap {
      translate: -7px 0px;
      font-size: 12px;
    }
    .tap_dance.shifted {
      translate: 7px 17px;
      font-size: 12px;
      opacity: 1.0;
    }

    /* Variant for symbol next to symbol */
    .sym_by_sym.tap {
      translate: -6px 0px;
    }
    .sym_by_sym.shifted {
      translate: 10px 12px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.tap {
      translate: -35px 0px;
    }
    .combo.sym_by_sym.shifted {
      translate: 35px 20px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.hold {
      visibility: hidden;
    }

    /* hide hold box for combo sym_by_sym */
    .combo.sym_by_sym.hold > path[stroke="none"][fill="none"] {
      visibility: hidden;
    }

  shrink_wide_legends: 6
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  mark_alternate_layer_activators: true
  sticky_label: $$mdi:gesture-tap-hold$$
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans

  # Legends on the layer keys; headers keep the keymap's display-name
  layer_legend_map:
    lower: SYM
    num: NUM

  # Unmapped modifier functions (e.g. LC(Q)) render with macOS modifier symbols
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "⌥"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"

  # Legends below are what macOS Spanish-ISO (com.apple.keylayout.Spanish-ISO) types,
  # derived with UCKeyTranslate, not the US meaning of the ZMK keycode names.
  raw_binding_map:
    # Thumbs and layer keys
    "&cmd_space":
      tap: $$mdi:magnify$$
      hold: SYM
      shifted: "2× ⌘␣"
    # Outer columns
    "&service_mode LS(LA(APOSTROPHE)) GRAVE":
      tap: "º"
      shifted: "ª"
      hold: "«"
    "&generic_tap_hold LS(MINUS) MINUS":
      tap: "'"
      hold: "?"
    "&generic_tap_hold EQUAL N0":
      tap: "0"
      shifted: "="
      hold: "¡"
    "&generic_tap_hold RBKT LBKT":
      tap: "`"
      shifted: "^"
      hold: "+"
    # Spanish/Catalan letters on hold
    "&c_trencada BACKSLASH C":
      tap: C
      hold: "ç"
    "&enya SEMICOLON N":
      tap: N
      hold: "ñ"
    # Home-row mods
    "&lhmod LEFT_SHIFT A":
      tap: A
      hold: $$mdi:apple-keyboard-shift$$
    "&lhmod LCTRL S":
      tap: S
      hold: $$mdi:apple-keyboard-control$$
    "&lhmod LEFT_ALT D":
      tap: D
      hold: $$mdi:apple-keyboard-option$$
    "&lhmod LEFT_GUI F":
      tap: F
      hold: $$mdi:apple-keyboard-command$$
    "&rhmod RIGHT_GUI U":
      tap: U
      hold: $$mdi:apple-keyboard-command$$
    "&rhmod RIGHT_ALT I":
      tap: I
      hold: $$mdi:apple-keyboard-option$$
    "&rhmod RCTRL O":
      tap: O
      hold: $$mdi:apple-keyboard-control$$
    "&rhmod RIGHT_SHIFT P":
      tap: P
      hold: $$mdi:apple-keyboard-shift$$
    # Literal dead-key characters (dead key, then Space)
    "&caret": "^"
    "&tilde": "~"
    "&grave_lit": "`"
    # Macros
    "&sleep": $$mdi:power-sleep$$
    "&next_page":
      tap: $$mdi:page-next-outline$$
      shifted: "⌘´"
    "&previous_page":
      tap: $$mdi:page-previous-outline$$
      shifted: "⌘ñ"
    "&soft_off": $$mdi:power$$
    # Mouse
    "&msc SCRL_UP":
      tap: $$mdi:pan-up$$
      hold: ''
      shifted: ''
    "&msc SCRL_DOWN":
      tap: $$mdi:pan-down$$
      hold: ''
      shifted: ''
    "&msc SCRL_LEFT":
      tap: $$mdi:pan-left$$
      hold: ''
      shifted: ''
    "&msc SCRL_RIGHT":
      tap: $$mdi:pan-right$$
      hold: ''
      shifted: ''
    "&mmv MOVE_LEFT":
      tap: $$mdi:menu-left$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_RIGHT":
      tap: $$mdi:menu-right$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_UP":
      tap: $$mdi:menu-up$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_DOWN":
      tap: $$mdi:menu-down$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mkp LCLK":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp RCLK":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MCLK":
      tap: $$mdi:mouse-scroll-wheel$$

    # Empty
    "&none":
      tap: $$mdi:minus-circle-outline$$
      type: none

    # Bluetooth
    "&bt BT_SEL 0":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 1
    "&bt BT_SEL 1":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 2
    "&bt BT_SEL 2":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 3
    "&bt BT_SEL 3":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 4
    "&bt BT_SEL 4":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 5

  # ZMK keycode -> legend. Characters are what each HID key types on macOS Spanish-ISO
  # (keyboard type 40), e.g. MINUS types ' and LBKT is the dead ` key.
  zmk_keycode_map:
    # Number row
    N1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: '"'
    N3:
      tap: 3
      shifted: "·"
    N4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "&"
    N7:
      tap: 7
      shifted: "/"
    N8:
      tap: 8
      shifted: "("
    N9:
      tap: 9
      shifted: ")"
    N0:
      tap: 0
      shifted: "="
    MINUS:
      tap: "'"
      shifted: "?"
    EQUAL:
      tap: "¡"
      shifted: "¿"
    GRAVE:
      tap: "º"
      shifted: "ª"

    # Punctuation keys (dead keys: LBKT ` / ^, SQT ´ / ¨)
    LEFT_BRACKET:
      tap: "`"
      shifted: "^"
    LBKT:
      tap: "`"
      shifted: "^"
    RIGHT_BRACKET:
      tap: "+"
      shifted: "*"
    RBKT:
      tap: "+"
      shifted: "*"
    SEMICOLON:
      tap: "ñ"
      shifted: "Ñ"
    SEMI:
      tap: "ñ"
      shifted: "Ñ"
    SINGLE_QUOTE:
      tap: "´"
      shifted: "¨"
    SQT:
      tap: "´"
      shifted: "¨"
    APOSTROPHE:
      tap: "´"
      shifted: "¨"
    APOS:
      tap: "´"
      shifted: "¨"
    BACKSLASH:
      tap: "ç"
      shifted: "Ç"
    BSLH:
      tap: "ç"
      shifted: "Ç"
    NON_US_BACKSLASH:
      tap: "<"
      shifted: ">"
    NON_US_BSLH:
      tap: "<"
      shifted: ">"
    COMMA:
      tap: ","
      shifted: ";"
    PERIOD:
      tap: "."
      shifted: ":"
    DOT:
      tap: "."
      shifted: ":"
    SLASH:
      tap: "-"
      shifted: "_"
    FSLH:
      tap: "-"
      shifted: "_"
    # ZMK PERCENT is LS(N5)
    PERCENT: "%"
    PRCNT: "%"

    # Shifted and Option (RA) combinations used in the keymap
    LS(N1): "!"
    LS(N2): '"'
    LS(N3): "·"
    LS(N4): "$"
    LS(N5): "%"
    LS(N6): "&"
    LS(N7): "/"
    LS(N8): "("
    LS(N9): ")"
    LS(N0): "="
    LS(MINUS): "?"
    LS(FSLH): "_"
    LS(RBKT): "*"
    LS(RIGHT_BRACKET): "*"
    LS(NON_US_BSLH): ">"
    RA(N1): "|"
    RA(N2): "@"
    RA(N3): "#"
    RA(GRAVE): '\'
    RA(SQT): "{"
    RA(BSLH): "}"
    RA(LBKT): "["
    RA(RBKT): "]"

    # Modifiers
    LCTRL: $$mdi:apple-keyboard-control$$
    LEFT_CONTROL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LEFT_ALT: $$mdi:apple-keyboard-option$$
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LEFT_SHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LCMD: $$mdi:apple-keyboard-command$$
    LG: $$mdi:apple-keyboard-command$$
    LGUI: $$mdi:apple-keyboard-command$$
    LEFT_GUI: $$mdi:apple-keyboard-command$$
    LEFT_COMMAND: $$mdi:apple-keyboard-command$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RIGHT_CONTROL: $$mdi:apple-keyboard-control$$
    RALT: $$mdi:apple-keyboard-option$$
    RIGHT_ALT: $$mdi:apple-keyboard-option$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_SHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RCMD: $$mdi:apple-keyboard-command$$
    RG: $$mdi:apple-keyboard-command$$
    RGUI: $$mdi:apple-keyboard-command$$
    PSCRN: $$mdi:printer-outline$$
    RIGHT_COMMAND: $$mdi:apple-keyboard-command$$
    PAGE_UP:
      tap: 'PgUp'
      shifted: ''
    PG_UP:
      tap: 'PgUp'
      shifted: ''
    PAGE_DOWN:
      tap: 'PgDn'
      shifted: ''
    PG_DN:
      tap: 'PgDn'
      shifted: ''
    INSERT:
       tap: 'Ins'
       shifted: ''
    # "Meh" key
    LS(LC(LALT)): $$mdi:star-three-points$$

    # Arrows
    UP: $$mdi:arrow-up-bold$$
    UP_ARROW: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    DOWN_ARROW: $$mdi:arrow-down-bold$$
    LEFT_ARROW: $$mdi:arrow-left-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    RIGHT_ARROW: $$mdi:arrow-right-bold$$

    # Whitespace
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$

    # Locks
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$

    # Sound
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$
    C_VOLUME_UP: $$mdi:volume-high$$
    C_VOLUME_DOWN: $$mdi:volume-low$$

    # Media
    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PP: $$mdi:play-pause$$

    # Bluetooth
    BT_CLR: $$mdi:bluetooth-off$$
    BT_SEL: $$mdi:bluetooth-connect$$

    # Settings
    C_BRI_UP: $$mdi:brightness-5$$
    C_BRIGHTNESS_INC: $$mdi:brightness-5$$
    C_BRI_DN: $$mdi:brightness-7$$
    C_BRI_DEC: $$mdi:brightness-7$$
    C_BRIGHTNESS_DEC: $$mdi:brightness-7$$

    # System
    C_POWER: $$mdi:power-standby$$
    C_AL_LOCK: $$mdi:lock$$
    K_CANCEL: $$mdi:close-box$$
    K_FIND: $$mdi:apple-finder$$
